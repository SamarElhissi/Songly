name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend (fake generators only; no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Backend tests
        run: python -m pytest
        env:
          SONGCRAFT_MUSIC_GENERATOR: fake
          SONGCRAFT_LYRICS_GENERATOR: fake
          SONGCRAFT_VOCAL_SYNTHESIZER: fake
          SONGCRAFT_MIXER: fake
          SONGCRAFT_BEAT_ANALYZER: fake
          SONGCRAFT_JOB_QUEUE: inline

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
